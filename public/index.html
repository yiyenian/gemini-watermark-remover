<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Watermark Remover - 智能无损去水印</title>
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 JSZip 用于多图一键打包 ZIP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#10b981',
            'primary-hover': '#059669',
          }
        }
      }
    }
  </script>
  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.08); }
    }
    .animate-glow { animation: pulseGlow 4s ease-in-out infinite; }
    
    /* 彻底隐藏原作者丑陋的批量默认列表 */
    #imageList { display: none !important; }
  </style>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.body.classList.remove('loading');
      
      const singlePreview = document.getElementById('singlePreview');
      const multiPreview = document.getElementById('multiPreview');
      const heroSection = document.getElementById('heroSection');
      const uploadCardWrapper = document.getElementById('uploadCardWrapper');

      const toggleLayout = () => {
        const isSingleActive = singlePreview.style.display !== 'none';
        const isMultiActive = multiPreview.style.display !== 'none';
        if (isSingleActive || isMultiActive) {
          if (heroSection) heroSection.style.display = 'none';
          if (uploadCardWrapper) uploadCardWrapper.style.display = 'none';
        } else {
          if (heroSection) heroSection.style.display = 'block';
          if (uploadCardWrapper) uploadCardWrapper.style.display = 'block';
        }
      };

      const observer = new MutationObserver(toggleLayout);
      observer.observe(singlePreview, { attributes: true, attributeFilter: ['style'] });
      observer.observe(multiPreview, { attributes: true, attributeFilter: ['style'] });

      // 核心拦截与画廊增强：把多图队列转化为“左右无缝切换”的沉浸式单图大图体验
      let batchCleanImages = [];
      let currentIndex = 0;

      const observerImageList = new MutationObserver(() => {
        const imgs = document.querySelectorAll('#imageList img');
        batchCleanImages = [];
        imgs.forEach(img => {
          if (img.src && img.src.startsWith('data:image')) {
            batchCleanImages.push(img.src);
          }
        });

        // 如果有多张图，我们在操作面板注入“上一张/下一张”和“打包ZIP”按钮
        if (batchCleanImages.length > 1) {
          let navContainer = document.getElementById('batchNavContainer');
          if (!navContainer) {
            const panel = document.querySelector('#singlePreview .space-y-2.5');
            if (panel) {
              navContainer = document.createElement('div');
              navContainer.id = 'batchNavContainer';
              navContainer.className = 'flex gap-2 pt-2 border-t border-slate-100 mt-2';
              navContainer.innerHTML = `
                <button id="prevImgBtn" class="flex-1 py-2 px-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-1">
                  &larr; 上一张
                </button>
                <button id="nextImgBtn" class="flex-1 py-2 px-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-1">
                  下一张 &rarr;
                </button>
              `;
              panel.appendChild(navContainer);

              document.getElementById('prevImgBtn').onclick = () => {
                if (batchCleanImages.length === 0) return;
                currentIndex = (currentIndex - 1 + batchCleanImages.length) % batchCleanImages.length;
                updateGalleryView();
              };
              document.getElementById('nextImgBtn').onclick = () => {
                if (batchCleanImages.length === 0) return;
                currentIndex = (currentIndex + 1) % batchCleanImages.length;
                updateGalleryView();
              };
            }
          }
        }
      });

      const imageListEl = document.getElementById('imageList');
      if (imageListEl) {
        observerImageList.observe(imageListEl, { childList: true, subtree: true });
      }

      function updateGalleryView() {
        if (batchCleanImages.length > 0 && batchCleanImages[currentIndex]) {
          const processedImg = document.getElementById('processedImage');
          if (processedImg) {
            processedImg.src = batchCleanImages[currentIndex];
            const statusMsg = document.getElementById('statusMessage');
            if (statusMsg) statusMsg.innerText = `正在浏览第 ${currentIndex + 1} / ${batchCleanImages.length} 张图`;
          }
        }
      }

      // 注入打包 ZIP 按钮到单张控制面板下方
      const panelParent = document.querySelector('#singlePreview .space-y-2.5');
      if (panelParent && !document.getElementById('zipAllBtn')) {
        const zipBtn = document.createElement('button');
        zipBtn.id = 'zipAllBtn';
        zipBtn.className = 'w-full py-2.5 px-3 bg-emerald-600 hover:bg-emerald-700 text-white active:scale-[0.98] rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2 shadow-md shadow-emerald-600/20 mt-2';
        zipBtn.innerHTML = `
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
          <span>打包下载全部 ZIP</span>
        `;
        zipBtn.onclick = async () => {
          if (typeof JSZip === 'undefined') {
            alert('ZIP 库加载中，请稍后');
            return;
          }
          const zip = new JSZip();
          const folder = zip.folder("gemini-watermark-removed");
          const imgs = document.querySelectorAll('#imageList img');
          if (imgs.length === 0) {
            alert('暂无可打包的图片');
            return;
          }
          zipBtn.innerText = '正在打包...';
          let count = 0;
          imgs.forEach((img, idx) => {
            if (img.src && img.src.startsWith('data:image')) {
              folder.file(`clean_${idx + 1}.png`, img.src.split(',')[1], { base64: true });
              count++;
            }
          });
          if (count === 0) {
            alert('图片尚未处理完成');
            zipBtn.innerText = '打包下载全部 ZIP';
            return;
          }
          const content = await zip.generateAsync({ type: "blob" });
          const url = URL.createObjectURL(content);
          const a = document.createElement('a');
          a.href = url;
          a.download = `gemini_cleaned_${Date.now()}.zip`;
          a.click();
          URL.revokeObjectURL(url);
          zipBtn.innerText = '打包下载全部 ZIP';
        };
        panelParent.appendChild(zipBtn);
      }
    });
  </script>
</head>
<body class="h-full bg-slate-50 text-slate-800 antialiased selection:bg-emerald-500 selection:text-white flex flex-col justify-between loading overflow-x-hidden relative">

  <!-- 背景光晕 -->
  <div class="absolute top-10 left-1/3 w-96 h-96 bg-emerald-200/30 rounded-full blur-3xl pointer-events-none animate-glow"></div>
  <div class="absolute bottom-10 right-1/4 w-96 h-96 bg-cyan-200/20 rounded-full blur-3xl pointer-events-none animate-glow" style="animation-delay: 2s;"></div>

  <!-- 顶部导航：放大、居中、大气 -->
  <header class="w-full max-w-4xl mx-auto px-6 py-6 flex items-center justify-center z-20 flex-shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-emerald-400 to-emerald-600 flex items-center justify-center text-white shadow-md shadow-emerald-500/20">
        <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m12 3-1.9 5.8-5.8 1.9 5.8 1.9 1.9 5.8 1.9-5.8 5.8-1.9-5.8-1.9Z"></path>
        </svg>
      </div>
      <span class="text-lg font-black tracking-tight text-slate-900">Gemini Watermark Remover</span>
    </div>
  </header>

  <!-- 主体内容区 -->
  <main class="w-full max-w-6xl mx-auto px-4 flex flex-col items-center justify-center z-10 flex-grow my-auto py-2">
    
    <!-- 标题和介绍 -->
    <div id="heroSection" class="text-center max-w-xl mx-auto mb-8">
      <h1 class="text-4xl font-black text-slate-900 tracking-tight mb-3">
        一键清除 Gemini 水印
      </h1>
      <p class="text-slate-500 text-sm">
        支持单张或批量选择多张图片，数学反向混合无损还原。
      </p>
    </div>

    <!-- 上传卡片区域 -->
    <div id="uploadCardWrapper" class="w-full max-w-2xl bg-white rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-200/80 p-8 transition-all">
      <div id="uploadArea" class="group relative flex flex-col items-center justify-center w-full h-56 rounded-2xl border-2 border-dashed border-slate-300 bg-slate-50/50 hover:bg-emerald-50/30 hover:border-emerald-400 transition-all cursor-pointer">
        <div class="flex flex-col items-center justify-center relative z-10 px-4 text-center">
          <div class="w-14 h-14 bg-white rounded-2xl shadow-sm border border-slate-200 flex items-center justify-center mb-4 text-emerald-600 group-hover:scale-110 transition-all">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </div>
          <p class="mb-1 text-base font-bold text-slate-700 group-hover:text-emerald-700">
            点击或拖拽多个图片/视频文件到此处（支持批量）
          </p>
          <p class="text-xs text-slate-400">
            支持 JPG、PNG、WebP 及主流视频文件多选
          </p>
        </div>
        <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm,video/quicktime,video/*" multiple class="hidden" />
      </div>
    </div>

    <!-- 沉浸式大图滑块对比区（单图与多图通用，支持左右无缝对比与切换） -->
    <section id="singlePreview" class="w-full" style="display: none;">
      <div class="w-full flex flex-col lg:flex-row gap-6 items-center justify-center">
        <div class="flex-1 w-full overflow-hidden flex flex-col items-center">
          <div class="w-full max-w-6xl flex justify-between items-center mb-2 px-1">
            <h3 class="text-xs font-bold text-slate-700 flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
              效果对比预览（左右拖动滑块查看无水印大图）
            </h3>
            <div class="flex gap-4">
              <span id="originalInfo" class="text-[10px] text-slate-400 font-mono"></span>
              <span id="processedInfo" class="text-[10px] text-emerald-600 font-mono font-semibold" style="display: none;"></span>
            </div>
          </div>

          <div class="relative w-full flex items-center justify-center bg-transparent rounded-2xl overflow-hidden select-none min-h-[600px] sm:min-h-[82vh]">
            <div id="comparisonContainer" class="relative mx-auto w-fit max-w-full">
              <img id="originalImage" class="block w-auto h-auto max-w-full max-h-[84vh] object-contain object-right-bottom rounded-xl shadow-lg" draggable="false" />
              <div id="processedOverlay" class="absolute top-0 left-0 h-full w-[50%] overflow-hidden border-r-2 border-emerald-500 shadow-2xl box-content z-10" style="display: none;">
                <img id="processedImage" class="block h-full max-w-none object-contain object-right-bottom" draggable="false" />
              </div>
              <div id="sliderHandle" class="absolute top-0 bottom-0 w-10 -ml-5 z-20 cursor-col-resize flex items-center justify-center group-hover:opacity-100 transition-opacity" style="left: 50%; display: none;">
                <div class="absolute w-6 h-6 bg-emerald-500 rounded-full shadow-md flex items-center justify-center border-2 border-white text-white">
                  <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8 9l-3 3 3 3m8-6l3 3-3 3"></path></svg>
                </div>
              </div>
              <div class="absolute top-3 left-3 bg-white/90 backdrop-blur text-emerald-600 text-[10px] font-semibold px-2.5 py-1 rounded-md border border-emerald-200 shadow-sm pointer-events-none z-30">去水印后</div>
              <div class="absolute top-3 right-3 bg-white/90 backdrop-blur text-slate-600 text-[10px] font-semibold px-2.5 py-1 rounded-md border border-slate-200 shadow-sm pointer-events-none z-30">原图</div>
            </div>
          </div>
        </div>

        <div class="w-full lg:w-56 flex-shrink-0 flex flex-col justify-center">
          <div class="bg-white/90 backdrop-blur-xl p-4 rounded-2xl shadow-xl border border-slate-200/80">
            <h4 class="text-xs font-bold text-slate-700 mb-3">操作选项</h4>
            <div class="space-y-2.5">
              <button id="copyBtn" class="w-full py-2.5 px-3 bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2 shadow-md shadow-emerald-600/20" style="display: none;">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m-1 10H8m4-3H8m1.5 6H8"></path></svg>
                <span>复制处理结果</span>
              </button>

              <button id="downloadBtn" class="w-full py-2.5 px-3 bg-slate-900 hover:bg-slate-800 text-white active:scale-[0.98] rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2 shadow-md" style="display: none;">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                <span>下载无水印文件</span>
              </button>

              <button id="resetBtn" class="w-full py-2.5 px-3 bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 active:scale-[0.98] rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                <span>重新选择文件</span>
              </button>
            </div>
            <div id="statusMessage" class="mt-2 text-[10px] text-slate-400 min-h-[0.8rem] text-center"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- 隐藏原生的多图网格，由后台逻辑自动驱动滑块画廊切换 -->
    <section id="multiPreview" class="w-full" style="display: none;">
      <div id="imageList"></div>
    </section>

  </main>

  <!-- 底部版权 -->
  <footer class="w-full max-w-5xl mx-auto px-6 py-4 z-20 flex-shrink-0 text-center text-xs text-slate-400">
    <p>Gemini Watermark Remover &mdash; 100% Client-side Processing</p>
  </footer>

  <!-- 加载遮罩 -->
  <div id="loadingOverlay" class="fixed inset-0 bg-slate-900/30 backdrop-blur-xs z-[60] hidden flex items-center justify-center">
    <div class="bg-white px-6 py-4 rounded-2xl shadow-2xl border border-slate-200 flex items-center gap-3">
      <div class="animate-spin rounded-full h-5 w-5 border-2 border-emerald-500 border-t-transparent"></div>
      <p class="text-slate-700 text-xs font-bold tracking-wide">正在通过逆向混合算法去水印...</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
