<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Watermark Remover - 智能无损去水印</title>
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#10b981',
            'primary-hover': '#059669',
          }
        }
      }
    }
  </script>
  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.08); }
    }
    .animate-glow { animation: pulseGlow 4s ease-in-out infinite; }
  </style>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.body.classList.remove('loading');
      
      const singlePreview = document.getElementById('singlePreview');
      const multiPreview = document.getElementById('multiPreview');
      const heroSection = document.getElementById('heroSection');
      const uploadCardWrapper = document.getElementById('uploadCardWrapper');

      const toggleLayout = () => {
        const isSingleActive = singlePreview.style.display !== 'none';
        const isMultiActive = multiPreview.style.display !== 'none';
        if (isSingleActive || isMultiActive) {
          if (heroSection) heroSection.style.display = 'none';
          if (uploadCardWrapper) uploadCardWrapper.style.display = 'none';
        } else {
          if (heroSection) heroSection.style.display = 'block';
          if (uploadCardWrapper) uploadCardWrapper.style.display = 'block';
        }
      };

      const observer = new MutationObserver(toggleLayout);
      observer.observe(singlePreview, { attributes: true, attributeFilter: ['style'] });
      observer.observe(multiPreview, { attributes: true, attributeFilter: ['style'] });
    });
  </script>
</head>
<body class="h-full bg-gradient-to-br from-slate-50 via-white to-emerald-50/40 text-slate-800 antialiased selection:bg-emerald-500 selection:text-white flex flex-col justify-between loading overflow-hidden relative">

  <!-- 背景光晕 -->
  <div class="absolute top-10 left-1/3 w-96 h-96 bg-emerald-200/40 rounded-full blur-3xl pointer-events-none animate-glow"></div>
  <div class="absolute bottom-10 right-1/4 w-96 h-96 bg-cyan-200/30 rounded-full blur-3xl pointer-events-none animate-glow" style="animation-delay: 2s;"></div>

  <!-- 顶部精简导航 -->
  <header class="w-full max-w-[96%] mx-auto px-4 py-2 flex items-center justify-between z-20 flex-shrink-0">
    <div class="flex items-center gap-2">
      <div class="w-6 h-6 rounded-lg bg-gradient-to-br from-emerald-400 to-emerald-600 flex items-center justify-center text-white shadow-sm">
        <svg class="w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m12 3-1.9 5.8-5.8 1.9 5.8 1.9 1.9 5.8 1.9-5.8 5.8-1.9-5.8-1.9Z"></path>
        </svg>
      </div>
      <span class="text-xs font-bold text-slate-900">Gemini Watermark Remover</span>
    </div>
    <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200/60">
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
      100% 本地计算（支持批量多选）
    </span>
  </header>

  <!-- 主体内容区 -->
  <main class="w-full max-w-[96%] mx-auto px-2 flex flex-col items-center justify-center z-10 flex-grow my-auto">
    
    <!-- 标题和介绍 -->
    <div id="heroSection" class="text-center max-w-lg mx-auto mb-3">
      <h1 class="text-2xl font-black text-slate-900 tracking-tight mb-1">
        一键清除 Gemini 水印
      </h1>
      <p class="text-slate-500 text-xs">
        支持单张或按住 Ctrl / Shift 批量选择多张图片，数学反向混合无损还原。
      </p>
    </div>

    <!-- 上传卡片区域 -->
    <div id="uploadCardWrapper" class="w-full max-w-2xl bg-white/90 backdrop-blur-xl rounded-3xl shadow-xl border border-slate-200/80 p-4 transition-all">
      <div id="uploadArea" class="group relative flex flex-col items-center justify-center w-full h-40 rounded-2xl border-2 border-dashed border-slate-300 bg-slate-50/70 hover:bg-emerald-50/40 hover:border-emerald-400 transition-all cursor-pointer">
        <div class="flex flex-col items-center justify-center relative z-10 px-4 text-center">
          <div class="w-10 h-10 bg-white rounded-xl shadow-sm border border-slate-200 flex items-center justify-center mb-2 text-emerald-600 group-hover:scale-110 transition-all">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </div>
          <p class="mb-1 text-xs font-bold text-slate-700 group-hover:text-emerald-700">
            点击或拖拽多个图片/视频文件到此处（支持批量）
          </p>
          <p class="text-[10px] text-slate-400">
            支持 JPG、PNG、WebP 及主流视频
          </p>
        </div>
        <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm,video/quicktime,video/*" multiple class="hidden" />
      </div>
    </div>

    <!-- 单张预览区 (极限放大，最大化利用屏幕空间) -->
    <section id="singlePreview" class="w-full" style="display: none;">
      <div class="bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl border border-slate-200 p-3 sm:p-4 flex flex-col lg:flex-row gap-4 items-center">
        <div class="flex-1 w-full overflow-hidden">
          <div class="flex justify-between items-center mb-2 pb-1 border-b border-slate-100">
            <h3 class="text-xs font-bold text-slate-700 flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
              效果对比预览（左右拖动滑块查看无水印大图）
            </h3>
            <div class="flex gap-4">
              <span id="originalInfo" class="text-[10px] text-slate-400 font-mono"></span>
              <span id="processedInfo" class="text-[10px] text-emerald-600 font-mono font-semibold" style="display: none;"></span>
            </div>
          </div>

          <!-- 图片预览容器：最大高度提升至 85vh，确保大图超震撼显示 -->
          <div class="relative w-full flex items-center justify-center bg-slate-100 rounded-2xl overflow-hidden select-none min-h-[500px] sm:min-h-[75vh] border border-slate-200">
            <div id="comparisonContainer" class="relative mx-auto w-fit max-w-full">
              <img id="originalImage" class="block w-auto h-auto max-w-full max-h-[85vh] object-contain object-right-bottom rounded-xl shadow-sm" draggable="false" />
              <div id="processedOverlay" class="absolute top-0 left-0 h-full w-[50%] overflow-hidden border-r-2 border-emerald-500 shadow-2xl box-content z-10" style="display: none;">
                <img id="processedImage" class="block h-full max-w-none object-contain object-right-bottom" draggable="false" />
              </div>
              <div id="sliderHandle" class="absolute top-0 bottom-0 w-10 -ml-5 z-20 cursor-col-resize flex items-center justify-center group-hover:opacity-100 transition-opacity" style="left: 50%; display: none;">
                <div class="absolute w-6 h-6 bg-emerald-500 rounded-full shadow-md flex items-center justify-center border-2 border-white text-white">
                  <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8 9l-3 3 3 3m8-6l3 3-3 3"></path></svg>
                </div>
              </div>
              <div class="absolute. top-2.5 left-2.5 bg-white/90 backdrop-blur text-emerald-600 text-[10px] font-semibold px-2 py-0.5 rounded-md border border-emerald-200 shadow-xs pointer-events-none z-30">去水印后</div>
              <div class="absolute top-2.5 right-2.5 bg-white/90 backdrop-blur text-slate-600 text-[10px] font-semibold px-2 py-0.5 rounded-md border border-slate-200 shadow-xs pointer-events-none z-30">原图</div>
            </div>
          </div>
        </div>

        <!-- 右侧操作控制面板 -->
        <div class="w-full lg:w-56 flex-shrink-0 flex flex-col justify-center">
          <div class="bg-slate-50/90 p-3.5 rounded-2xl border border-slate-200">
            <h4 class="text-xs font-bold text-slate-700 mb-2.5">操作选项</h4>
            <div class="space-y-2">
              <button id="copyBtn" class="w-full py-2 px-3 bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2 shadow-md shadow-emerald-600/20" style="display: none;">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m-1 10H8m4-3H8m1.5 6H8"></path></svg>
                <span>复制处理结果</span>
              </button>

              <button id="downloadBtn" class="w-full py-2 px-3 bg-slate-900 hover:bg-slate-800 text-white active:scale-[0.98] rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2 shadow-md" style="display: none;">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                <span>下载无水印文件</span>
              </button>

              <button id="resetBtn" class="w-full py-2 px-3 bg-white border border-slate-200 text-slate-700 hover:bg-slate-100 active:scale-[0.98] rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                <span>重新选择文件</span>
              </button>
            </div>
            <div id="statusMessage" class="mt-2 text-[10px] text-slate-400 min-h-[0.8rem] text-center"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- 批量预览区 -->
    <section id="multiPreview" class="w-full" style="display: none;">
      <div class="bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl border border-slate-200 overflow-hidden">
        <div class="bg-slate-50 px-5 py-2.5 border-b border-slate-200 flex justify-between items-center">
          <div>
            <h3 class="text-xs font-bold text-slate-700">批量处理队列</h3>
            <p id="progressText" class="text-[10px] text-slate-400 mt-0.5">处理进度: 0/0</p>
          </div>
          <button id="batchResetBtn" class="py-1 px-2.5 bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 active:scale-[0.98] rounded-lg text-xs font-semibold transition-all">
            清空并重新开始
          </button>
        </div>
        <div id="imageList" class="batch-list p-2.5 max-h-[75vh] overflow-y-auto"></div>
      </div>
    </section>

  </main>

  <!-- 底部版权 -->
  <footer class="w-full max-w-[96%] mx-auto px-4 py-1.5 z-20 flex-shrink-0 text-center text-[10px] text-slate-400">
    <p>Gemini Watermark Remover &mdash; 100% Client-side Processing</p>
  </footer>

  <!-- 加载遮罩 -->
  <div id="loadingOverlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-[60] hidden flex items-center justify-center">
    <div class="bg-white px-6 py-4 rounded-2xl shadow-2xl border border-slate-200 flex items-center gap-3">
      <div class="animate-spin rounded-full h-5 w-5 border-2 border-emerald-500 border-t-transparent"></div>
      <p class="text-slate-700 text-xs font-bold tracking-wide">正在通过逆向混合算法去水印...</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
